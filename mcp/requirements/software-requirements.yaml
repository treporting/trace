  source_ids:
  - ARC_29@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_7
  object_version: '1.1.1'
  component: requests
  object_text: send the process reference model the assistant asks for
  source_ids:
  - ARC_30@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_8
  object_version: '1.1.1'
  component: requests
  object_text: send each narrowing the assistant asks for with every request whose answer the reporter
    narrows by it, and every one as `*` or not at all
  source_ids:
  - ARC_31@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_9
  object_version: '1.1.1'
  component: requests
  object_text: send the level by its key as the head names it
  source_ids:
  - ARC_32@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_10
  object_version: '1.1.1'
  component: requests
  object_text: send the component and the unit the assistant asks for with a request on the code
  source_ids:
  - ARC_33@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_11
  object_version: '1.1.1'
  component: requests
  object_text: ask the reporter for the levels above each row only where the assistant asks for them
  source_ids:
