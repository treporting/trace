# Software requirements of mcp-trace (ARC_51), r5: from the system requirements allocated to the
# MCP server, from the requirements of the architecture on its interface ARC_52, which it offers an
# assistant, and on ARC_11, which it asks the reporter over. What explains them is in
# software-requirements.md.
# Format: formats.md of specs-and-deploy-process
schema: schemas/software-requirements.schema.json
type: requirements
level: r5
documents: [mcp/requirements/software-requirements.md]
requirements:
- object_key: SR_1
  object_version: '1.1.1'
  component: tools
  object_text: offer an assistant one tool per view of the viewer
  source_ids:
  - ARC_53@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_2
  object_version: '1.1.1'
  component: answers
  object_text: answer with each tool the figures its view shows, as the reporter answers them, adding
    none and leaving none out
  source_ids:
  - SYS_99@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_3
  object_version: '1.1.1'
  component: answers
  object_text: say with an answer it shortens how many rows it left out
  source_ids:
  - ARC_54@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_4
  object_version: '1.1.1'
  component: answers
  object_text: name with every answer the view of the viewer that shows the same
  source_ids:
  - ARC_81@1.1.1
  priority: 'medium'
  safety: ''
  status: draft
  verification_method:
  - test
- object_key: SR_5
  object_version: '1.1.1'
  component: answers
  object_text: name with every answer the filters that show the same in that view, the scope among them
  source_ids:
  - ARC_81@1.1.1
  priority: 'medium'
  safety: ''
  status: draft
  verification_method:
  - test
- object_key: SR_6
  object_version: '1.1.1'
  component: requests
  object_text: send with every request the organization, the project, the subsystem and the baseline,
