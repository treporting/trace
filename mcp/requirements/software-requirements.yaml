  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_14
  object_version: '1.1.1'
  component: operation
  object_text: start from a release with no setting other than those its operator manual names
  source_ids:
  - ARC_82@1.1.1
  priority: 'medium'
  safety: ''
  status: draft
  verification_method:
  - test
- object_key: SR_15
  object_version: '1.1.1'
  component: answers
  object_text: answer with each tool at most as many rows as the assistant names, 100 where it names none
  source_ids:
  - ARC_54@1.1.1
  priority: 'medium'
  safety: ''
  status: approved
  verification_method:
  - test
- object_key: SR_16
  object_version: '1.1.1'
  component: requests
